name: g4-observabilite

# ---------------------------------------------------------------------------
# Groupe 4 — OpenTelemetry + Jaeger : Observabilité applicative (APM)
# Démarrage : docker compose up -d --build
# Tous les ports sont liés à 127.0.0.1 : aucune interface d'admin n'est
# exposée sur le réseau local/LAN (durcissement).
# ---------------------------------------------------------------------------

services:
  # ------------------------- Couche applicative ----------------------------
  postgres:
    image: postgres:16-alpine
    container_name: g4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: ./api
    container_name: g4-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CHAOS_TOKEN: ${CHAOS_TOKEN}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-lab}
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${PORT_API:-18000}:8000"
    networks:
      - app-net
      - obs-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 320M

  frontend:
    container_name: g4-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    build:
      context: ./frontend
      args:
        PORT_JAEGER: ${PORT_JAEGER:-18686}
        PORT_GRAFANA: ${PORT_GRAFANA:-13000}
        PORT_PROMETHEUS: ${PORT_PROMETHEUS:-19090}
        PORT_MAILPIT_UI: ${PORT_MAILPIT_UI:-18025}
    ports:
      - "127.0.0.1:${PORT_FRONTEND:-18080}:80"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 96M

  # --------------------- Collecte & stockage des traces -------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: g4-otel-collector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:${PORT_OTLP_GRPC:-14317}:4317"  # OTLP gRPC (API Flask)
      - "127.0.0.1:${PORT_OTLP_HTTP:-14318}:4318"  # OTLP HTTP (debug)
      - "127.0.0.1:${PORT_COLLECTOR_METRICS:-18889}:8889"
    networks:
      - app-net
      - obs-net
    deploy:
      resources:
        limits:
          memory: 320M

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: g4-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------- Métriques, alertes, UI ---------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: g4-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          memory: 768M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: g4-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - amdata:/alertmanager
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          memory: 160M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: g4-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${PORT_GRAFANA:-13000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboard-provider.yml:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${PORT_GRAFANA:-13000}:3000"
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          memory: 512M

  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: g4-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${PORT_MAILPIT_SMTP:-11025}:1025"  # SMTP (debug)
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: g4-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=5s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    networks:
      - obs-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ------------- Reverse-proxy d'administration (basic auth) -------------
  gateway:
    build: ./config/nginx
    container_name: g4-gateway
    restart: unless-stopped
    environment:
      AUTH_USER: ${AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
    depends_on:
      - jaeger
      - mailpit
      - prometheus
      - alertmanager
    ports:
      - "127.0.0.1:${PORT_JAEGER:-18686}:16686"        # Jaeger UI       (basic auth)
      - "127.0.0.1:${PORT_MAILPIT_UI:-18025}:8025"     # Mailpit UI      (basic auth)
      - "127.0.0.1:${PORT_PROMETHEUS:-19090}:9090"     # Prometheus UI   (basic auth)
      - "127.0.0.1:${PORT_ALERTMANAGER:-19093}:9093"   # Alertmanager UI (basic auth)
    networks:
      - app-net
      - obs-net
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
  promdata:
  amdata:
  grafanadata:

networks:
  app-net:
    name: g4-app-net
  obs-net:
    name: g4-obs-net
