# Catalogue des alertes — Groupe 4
# Chaque règle : condition logique, seuil, persistance (for), sévérité, routage.
groups:
  - name: g4.performance
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[2m]))
          / clamp_min(sum(rate(http_requests_total[2m])), 0.001) > 0.05
        for: 30s
        labels:
          severity: critical
          category: performance
          team: sre
        annotations:
          summary: "Taux d'erreurs 5xx supérieur à 5 %"
          description: "Plus de 5 % des requêtes API échouent depuis 30 s. Chercher dans Jaeger les spans avec status=ERROR et l'attribut app.chaos_mode=error."
          impact: "Expérience utilisateur dégradée, SLO de disponibilité menacé."
          runbook: "docs/playbook.md#apihigherrorrate"

      - alert: ApiLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[2m]))) > 1
        for: 1m
        labels:
          severity: warning
          category: performance
          team: sre
        annotations:
          summary: "Latence p95 de l'API supérieure à 1 s"
          description: "Le 95e percentile dépasse 1 s depuis 1 minute. Corréler avec traces_span_metrics_duration et le span db.query dans Jaeger."
          impact: "Ralentissement perceptible, risque de timeout côté client."
          runbook: "docs/playbook.md#apilatencyp95high"

      - alert: DatabaseSlowQuery
        expr: rate(app_slow_queries_total[1m]) > 0
        for: 10s
        labels:
          severity: critical
          category: performance
          team: sre
        annotations:
          summary: "Requête SQL lente détectée (> 1 s)"
          description: "Au moins une requête PostgreSQL dépasse 1 s. Le span db.query porte db.duration.ms et db.statement : identifier la ligne coupable dans Jaeger."
          impact: "Goulet d'étranglement applicable à toute la cascade d'appels."
          runbook: "docs/playbook.md#databaseslowquery"

  - name: g4.securite
    rules:
      - alert: AdminLoginBruteForce
        expr: sum(increase(app_auth_failures_total{route="/api/admin/login"}[1m])) > 5
        for: 5s
        labels:
          severity: critical
          category: securite
          team: soc
        annotations:
          summary: "Brute-force probable sur /api/admin/login"
          description: "Plus de 5 échecs d'authentification en 1 minute. Inspecter les attributs app.user.login et l'événement auth.failure dans Jaeger."
          impact: "Tentative de compromission du compte administrateur."
          runbook: "docs/playbook.md#adminloginbruteforce"

      - alert: SuspiciousPathProbing
        expr: sum(increase(app_suspicious_requests_total[1m])) > 3
        for: 10s
        labels:
          severity: critical
          category: securite
          team: soc
        annotations:
          summary: "Sondage de chemins sensibles (/.env, /admin, /wp-login.php)"
          description: "Plus de 3 requêtes vers des chemins sensibles en 1 minute. Les spans portent app.security.suspicious=true."
          impact: "Reconnaissance web, précurseur d'une exploitation."
          runbook: "docs/playbook.md#suspiciouspathprobing"

      - alert: UnhandledExceptionBurst
        expr: rate(app_unhandled_errors_total[1m]) > 0.2
        for: 10s
        labels:
          severity: warning
          category: application
          team: sre
        annotations:
          summary: "Exceptions non gérées répétées dans l'API"
          description: "Des exceptions Python non gérées génèrent des 500. Chaque exception est enregistrée comme événement sur le span avec sa traceback."
          impact: "Instabilité applicative et fuite potentielle de détails techniques."
          runbook: "docs/playbook.md#unhandledexceptionburst"
