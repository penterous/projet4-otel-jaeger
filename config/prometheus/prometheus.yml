global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: g4-observabilite
    environment: lab

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API Flask : métriques RED exposées par prometheus-client
  - job_name: api-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Collecteur : métriques dérivées des spans (spanmetrics) + OTLP
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # USE : CPU / mémoire des conteneurs
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
