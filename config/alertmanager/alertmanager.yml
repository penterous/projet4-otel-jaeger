global:
  resolve_timeout: 1m
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@monitoring.lab"
  smtp_hello: "localhost"
  smtp_require_tls: false

route:
  group_by: ["alertname", "category"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 5m
  receiver: mail-soc

receivers:
  - name: mail-soc
    email_configs:
      - to: "soc@monitoring.lab"
        from: "alertmanager@monitoring.lab"
        smarthost: "mailpit:1025"
        require_tls: false
        send_resolved: true
        headers:
          Subject: '[G4][{{ .CommonLabels.severity }}] {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_matchers: ['severity = "critical"']
    target_matchers: ['severity = "warning"']
    equal: ["category"]
