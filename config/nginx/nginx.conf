# Jaeger UI — protégée par basic auth, liée à 127.0.0.1 dans docker-compose
server {
    listen 16686;
    server_name _;

    auth_basic "Acces restreint - Jaeger (Groupe 4)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://jaeger:16686;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

# Mailpit (boîte mail des alertes) — basic auth également
server {
    listen 8025;
    server_name _;

    auth_basic "Acces restreint - Mailpit (Groupe 4)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

